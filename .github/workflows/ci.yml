name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # three independent jobs that run side by side
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static
            command: pnpm typecheck && pnpm lint && pnpm deadcode
          - name: server tests
            command: pnpm --filter @multimodal-rag/server test
          - name: mobile tests
            command: pnpm --filter @multimodal-rag/mobile test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # compiling React Native is the slow part of the mobile tests, so keep Jest's cache between runs
      - uses: actions/cache@v4
        if: matrix.name == 'mobile tests'
        with:
          path: apps/mobile/.jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/jest.config.cjs') }}
          restore-keys: jest-${{ runner.os }}-

      - run: ${{ matrix.command }}

  # one stable name for the whole run
  checks:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.verify.result }}" = "success"
